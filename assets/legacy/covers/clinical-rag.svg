<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="800" height="500" fill="#eef1f5"/>
  <!-- unstructured clinical note -->
  <g transform="translate(60,90)">
    <rect width="200" height="280" fill="#f8f9fb" stroke="#d0d5dd" stroke-width="1.5"/>
    <g stroke="#98a2b3" stroke-width="5" stroke-linecap="round">
      <line x1="24" y1="40" x2="130" y2="40"/>
      <line x1="24" y1="70" x2="176" y2="70"/>
      <line x1="24" y1="94" x2="176" y2="94"/>
      <line x1="24" y1="118" x2="150" y2="118"/>
      <line x1="24" y1="142" x2="176" y2="142"/>
      <line x1="24" y1="166" x2="120" y2="166"/>
      <line x1="24" y1="190" x2="176" y2="190"/>
      <line x1="24" y1="214" x2="160" y2="214"/>
      <line x1="24" y1="238" x2="140" y2="238"/>
    </g>
    <!-- source span highlight -->
    <rect x="18" y="132" width="170" height="20" fill="#175cd3" opacity="0.18"/>
    <rect x="18" y="204" width="152" height="20" fill="#175cd3" opacity="0.18"/>
  </g>
  <!-- hierarchical chunks -->
  <g transform="translate(320,120)">
    <g fill="none" stroke="#98a2b3" stroke-width="1.3">
      <path d="M30,30 C60,30 60,0 90,0"/>
      <path d="M30,30 C60,30 60,60 90,60"/>
      <path d="M30,30 C60,30 60,120 90,120"/>
      <path d="M90,60 C115,60 115,90 140,90"/>
      <path d="M90,60 C115,60 115,60 140,60"/>
    </g>
    <rect x="0" y="18" width="30" height="24" rx="4" fill="#475467"/>
    <rect x="90" y="-12" width="30" height="24" rx="4" fill="none" stroke="#475467" stroke-width="1.8"/>
    <rect x="90" y="48" width="30" height="24" rx="4" fill="#175cd3"/>
    <rect x="90" y="108" width="30" height="24" rx="4" fill="none" stroke="#475467" stroke-width="1.8"/>
    <rect x="140" y="48" width="30" height="24" rx="4" fill="none" stroke="#175cd3" stroke-width="1.8"/>
    <rect x="140" y="78" width="30" height="24" rx="4" fill="none" stroke="#175cd3" stroke-width="1.8"/>
  </g>
  <text x="320" y="90" font-size="12" letter-spacing="2" fill="#8494ab">HIERARCHICAL CHUNKS</text>
  <text x="320" y="300" font-size="12" letter-spacing="2" fill="#8494ab">DUAL-STAGE RETRIEVAL</text>
  <g transform="translate(320,320)" fill="none" stroke="#175cd3" stroke-width="1.5">
    <circle cx="12" cy="12" r="9"/>
    <line x1="19" y1="19" x2="30" y2="30"/>
    <circle cx="54" cy="12" r="9"/>
    <line x1="61" y1="19" x2="72" y2="30"/>
    <path d="M34,8 h8 M76,8 h8" stroke="#98a2b3"/>
  </g>
  <!-- structured output -->
  <g transform="translate(560,110)">
    <rect width="180" height="240" rx="6" fill="#f8f9fb" stroke="#d0d5dd" stroke-width="1.5"/>
    <g font-size="11" letter-spacing="1" fill="#8494ab">
      <text x="20" y="34">{</text>
      <text x="34" y="60">"diagnosis":</text>
      <text x="34" y="108">"medication":</text>
      <text x="34" y="156">"follow_up":</text>
      <text x="20" y="216">}</text>
    </g>
    <g stroke="#175cd3" stroke-width="5" stroke-linecap="round" opacity="0.8">
      <line x1="40" y1="76" x2="130" y2="76"/>
      <line x1="40" y1="124" x2="110" y2="124"/>
      <line x1="40" y1="172" x2="140" y2="172"/>
    </g>
    <!-- trace lines back to source -->
  </g>
  <path d="M258,232 C300,232 520,186 558,186" fill="none" stroke="#175cd3" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <path d="M258,304 C300,304 520,282 558,282" fill="none" stroke="#175cd3" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="60" y="60" font-size="15" letter-spacing="3" fill="#8494ab">CLINICAL NOTES → AUDITABLE SUMMARY</text>
  <text x="560" y="382" font-size="12" letter-spacing="2" fill="#175cd3">EVERY FIELD TRACES TO A SPAN</text>
  <text x="60" y="430" font-size="12" letter-spacing="2" fill="#8494ab">FASTAPI · DOCKER</text>
</svg>
