<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="800" height="500" fill="#f2f0ec"/>
  <!-- soil layers -->
  <g transform="translate(70,240)">
    <rect width="320" height="60" fill="#d9d1c2"/>
    <rect y="60" width="320" height="60" fill="#c7bca8"/>
    <rect y="120" width="320" height="60" fill="#b3a68e"/>
    <rect width="320" height="180" fill="none" stroke="#57534c" stroke-width="1.5"/>
    <!-- sample points -->
    <g fill="#b4530a">
      <circle cx="50" cy="30" r="5"/>
      <circle cx="150" cy="90" r="5"/>
      <circle cx="250" cy="30" r="5"/>
      <circle cx="100" cy="150" r="5"/>
      <circle cx="220" cy="150" r="5"/>
    </g>
    <g stroke="#b4530a" stroke-width="1" fill="none" opacity="0.5">
      <path d="M50,30 L150,90 L250,30"/>
      <path d="M150,90 L100,150 M150,90 L220,150"/>
    </g>
  </g>
  <!-- plant -->
  <g transform="translate(230,240)" stroke="#4b5a3f" fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M0,0 C0,-40 0,-70 0,-95"/>
    <path d="M0,-40 C-24,-52 -38,-70 -42,-92"/>
    <path d="M0,-58 C22,-68 34,-84 38,-104"/>
    <path d="M-42,-92 C-30,-88 -20,-78 -16,-64" fill="#7a8a68" stroke="none"/>
  </g>
  <g transform="translate(230,240)" fill="#7a8a68">
    <path d="M0,-95 C-14,-112 -10,-132 6,-140 C18,-126 14,-106 0,-95"/>
    <path d="M-42,-92 C-58,-100 -64,-118 -54,-132 C-38,-124 -34,-106 -42,-92"/>
    <path d="M38,-104 C52,-112 58,-128 50,-142 C34,-134 30,-116 38,-104"/>
  </g>
  <!-- model panel -->
  <g transform="translate(480,100)">
    <rect width="250" height="140" rx="8" fill="#faf8f4" stroke="#d3ccc1" stroke-width="1.5"/>
    <text x="22" y="36" font-size="12" letter-spacing="2" fill="#8a857c">N · P · K · pH · MOISTURE</text>
    <g stroke="#a89f90" stroke-width="1.2" fill="none">
      <path d="M40,60 L125,84 M40,84 L125,84 M40,108 L125,84 M125,84 L210,84"/>
    </g>
    <circle cx="40" cy="60" r="6" fill="#57534c"/>
    <circle cx="40" cy="84" r="6" fill="#57534c"/>
    <circle cx="40" cy="108" r="6" fill="#57534c"/>
    <circle cx="125" cy="84" r="8" fill="#b4530a"/>
    <circle cx="210" cy="84" r="6" fill="none" stroke="#57534c" stroke-width="2"/>
  </g>
  <g transform="translate(480,280)">
    <text y="0" font-size="13" letter-spacing="2" fill="#8a857c">INDIAN SOIL DATASET</text>
    <text y="30" font-size="13" letter-spacing="2" fill="#8a857c">END-TO-END ML PIPELINE</text>
    <text y="68" font-size="13" letter-spacing="2" fill="#b4530a">→ FERTILIZER RECOMMENDATION</text>
  </g>
  <text x="70" y="60" font-size="15" letter-spacing="3" fill="#8a857c">SOIL → MODEL → YIELD</text>
</svg>
