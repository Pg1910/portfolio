<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <rect width="800" height="500" fill="#f2f0ec"/>
  <!-- document -->
  <g transform="translate(80,80)">
    <rect width="240" height="320" fill="#faf8f4" stroke="#d3ccc1" stroke-width="1.5"/>
    <g stroke="#b8b0a2" stroke-width="6" stroke-linecap="round">
      <line x1="28" y1="46" x2="150" y2="46"/>
      <line x1="28" y1="84" x2="212" y2="84"/>
      <line x1="28" y1="112" x2="212" y2="112"/>
      <line x1="28" y1="140" x2="184" y2="140"/>
      <line x1="28" y1="168" x2="212" y2="168"/>
      <line x1="28" y1="196" x2="160" y2="196"/>
    </g>
    <g stroke="#b4530a" stroke-width="6" stroke-linecap="round" opacity="0.85">
      <line x1="28" y1="238" x2="196" y2="238"/>
      <line x1="28" y1="266" x2="140" y2="266"/>
    </g>
  </g>
  <!-- agent pipeline -->
  <g transform="translate(400,120)">
    <g fill="none" stroke="#a89f90" stroke-width="1.5">
      <path d="M0,100 H70"/>
      <path d="M130,100 H200"/>
      <path d="M260,100 H330"/>
    </g>
    <g>
      <rect x="70" y="72" width="60" height="56" rx="8" fill="none" stroke="#57534c" stroke-width="2"/>
      <circle cx="100" cy="100" r="9" fill="#b4530a"/>
      <rect x="200" y="72" width="60" height="56" rx="8" fill="none" stroke="#57534c" stroke-width="2"/>
      <circle cx="230" cy="93" r="6" fill="#57534c"/>
      <circle cx="218" cy="110" r="6" fill="#57534c"/>
      <circle cx="242" cy="110" r="6" fill="#57534c"/>
    </g>
    <text x="70" y="58" font-size="12" letter-spacing="2" fill="#8a857c">ANALYZE</text>
    <text x="200" y="58" font-size="12" letter-spacing="2" fill="#8a857c">REASON</text>
  </g>
  <!-- report with engagement bars -->
  <g transform="translate(560,270)">
    <rect width="170" height="150" fill="#faf8f4" stroke="#d3ccc1" stroke-width="1.5"/>
    <g fill="#57534c">
      <rect x="26" y="96" width="18" height="34"/>
      <rect x="56" y="76" width="18" height="54" opacity="0.8"/>
      <rect x="86" y="88" width="18" height="42" opacity="0.6"/>
      <rect x="116" y="52" width="18" height="78" fill="#b4530a"/>
    </g>
    <line x1="20" y1="130" x2="150" y2="130" stroke="#8a857c" stroke-width="1.5"/>
    <text x="24" y="34" font-size="12" letter-spacing="2" fill="#8a857c">REPORT</text>
  </g>
  <!-- flow arrow doc -> pipeline start -->
  <path d="M330,240 C370,240 380,220 400,220" fill="none" stroke="#a89f90" stroke-width="1.5"/>
  <text x="80" y="56" font-size="15" letter-spacing="3" fill="#8a857c">CONTENT → AGENT → INSIGHT</text>
  <text x="400" y="300" font-size="13" letter-spacing="2" fill="#b4530a">AGENTIC PIPELINE</text>
</svg>
